name: Build & Test
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-26.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      # Every runner makes its own debug key, and Android only installs an update signed with the same key, so the
      # APK is signed with the key kept in the repository's secrets when there is one
      - name: Use the Honyaku signing key
        env:
          HONYAKU_KEYSTORE: ${{ secrets.HONYAKU_KEYSTORE }}
          HONYAKU_KEYSTORE_PASSWORD: ${{ secrets.HONYAKU_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$HONYAKU_KEYSTORE" ]; then
            echo "::warning::No HONYAKU_KEYSTORE secret, so this APK won't install over the previous one"
            exit 0
          fi
          echo "$HONYAKU_KEYSTORE" | base64 -d > "$RUNNER_TEMP/honyaku.jks"
          {
            echo "storeFile=$RUNNER_TEMP/honyaku.jks"
            echo "storePassword=$HONYAKU_KEYSTORE_PASSWORD"
            echo "keyAlias=honyaku"
            echo "keyPassword=$HONYAKU_KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build app
        run: ./gradlew assembleRelease -Pdist=ci

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      # Unzipped, so a phone can install it straight from the download.
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-arm64-v8a-release.apk Honyaku.apk

      - name: Upload Honyaku.apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: Honyaku.apk
          archive: false

      - name: Upload mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
